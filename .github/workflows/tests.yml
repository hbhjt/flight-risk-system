name: Unit tests
on: [push, pull_request]
jobs:
  api-and-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install fastapi==0.115.12 httpx==0.28.1 requests==2.32.3 pytest==8.3.5
      - run: python -m pytest -q
